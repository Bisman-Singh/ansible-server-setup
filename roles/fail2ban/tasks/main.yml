---
# =============================================================================
# Fail2ban Role - Intrusion prevention
# =============================================================================

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy fail2ban jail configuration
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Ensure fail2ban service is started and enabled
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
