---
# =============================================================================
# Site Playbook - Full Server Bootstrap and Hardening
# =============================================================================
# Applies all roles in the correct order to fully provision a server.
#
# Usage:
#   ansible-playbook playbooks/site.yml
#   ansible-playbook playbooks/site.yml --limit webservers
#   ansible-playbook playbooks/site.yml --tags "common,docker"

- name: Bootstrap and harden Linux servers
  hosts: all
  become: true
  gather_facts: true

  roles:
    - role: common
      tags: [common, base]

    - role: users
      tags: [users, base]

    - role: ssh-hardening
      tags: [ssh, security]

    - role: firewall
      tags: [firewall, security]

    - role: docker
      tags: [docker, runtime]

    - role: node-exporter
      tags: [node-exporter, monitoring]

    - role: fail2ban
      tags: [fail2ban, security]
